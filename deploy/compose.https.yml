# Merge with docker-compose.yml from the repository root. No certificates included.
services:
  backend:
    environment:
      - CORS_ORIGINS=${APP_ORIGIN:?Set the single canonical HTTPS origin}
  frontend:
    ports:
      - "443:443"
    volumes:
      - type: bind
        source: ${NGINX_HTTPS_CONFIG:?Set the generated absolute Nginx config path}
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_CERT_FILE:?Set the trusted certificate fullchain path}
        target: /etc/nginx/tls/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_KEY_FILE:?Set the private key path}
        target: /etc/nginx/tls/server.key
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
