# Optional FREE STATIC FRONTEND ONLY. Requires an existing durable backend.
# This is not a free full-stack deployment. Select Blueprint Path explicitly.
# Read docs/render-free-deployment.md before provisioning anything.
# Current uploads/backgrounds/TTS require durable local storage on the backend.
# External PostgreSQL alone does not persist their bytes, so no free backend
# is defined here. render.yaml remains the separate paid persistent-disk option.
services:
  - type: web
    runtime: static
    name: ai-chat-group-frontend-free
    autoDeployTrigger: off
    buildCommand: cd frontend && test -n "$VITE_BACKEND_URL" && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: VITE_BACKEND_URL
        sync: false
      - key: VITE_AUTH_MODE
        value: session
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
