name: Deploy to Render

on:
  workflow_run:
    workflows: [CI/CD Pipeline]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$main_sha" != "$TESTED_SHA" ]; then
            echo "CI 对应提交已不是 main 最新提交，跳过部署"
            exit 0
          fi
          if ! commit_message=$(git show -s --format=%B "$TESTED_SHA"); then
            echo "::error::Unable to read tested commit message; refusing Render deployment"
            exit 1
          fi
          # Match Render's documented skip phrases in the full commit message.
          case "${commit_message,,}" in
            *"[skip render]"*|*"[render skip]"*|*"[skip deploy]"*|*"[deploy skip]"*|*"[skip cd]"*|*"[cd skip]"*)
              echo "Tested commit requests a deployment skip; skipping Render deployment"
              exit 0
              ;;
          esac
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::warning::RENDER_API_KEY secret 未配置，跳过 Render 部署（Render 自动部署不受影响）"
            exit 0
          fi
          if [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::warning::RENDER_SERVICE_ID secret 未配置，跳过 Render 部署（Render 自动部署不受影响）"
            exit 0
          fi
          echo "Triggering Render deployment..."
          curl --fail --show-error --silent \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"commitId\":\"$TESTED_SHA\"}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys"
