name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QUNTHINK_REQUIRE_STORAGE_FIXTURES: '1'
      QUNTHINK_STORAGE_EVIDENCE_DIR: ${{ runner.temp }}/qunthink-storage-evidence
      QUNTHINK_TEST_PG_URL: postgresql://postgres:ci_test_only@127.0.0.1:5432/qunthink_ci
      QUNTHINK_TEST_MEMORY_TLS_URL: postgresql://postgres:ci_test_only@127.0.0.1:5432/qunthink_memory
      QUNTHINK_TEST_MEMORY_LEDGER_TLS_URL: postgresql://postgres:ci_test_only@127.0.0.1:5432/qunthink_ledger
      QUNTHINK_TEST_LIFECYCLE_PG_URL: postgresql://postgres:ci_test_only@127.0.0.1:5432/qunthink_lifecycle
      QUNTHINK_TEST_LIFECYCLE_LEDGER_URL: postgresql://postgres:ci_test_only@127.0.0.1:5432/qunthink_lifecycle_ledger
      QUNTHINK_TEST_COMMIT_PG_URL: postgresql://postgres:ci_test_only@127.0.0.1:5432/qunthink_wrapper
      QUNTHINK_TEST_COMMIT_LEDGER_URL: postgresql://postgres:ci_test_only@127.0.0.1:5432/qunthink_wrapper_ledger
      QUNTHINK_TEST_PAGING_PG_URL: postgresql://postgres:ci_test_only@127.0.0.1:5432/qunthink_paging
      QUNTHINK_TEST_PAGING_LEDGER_URL: postgresql://postgres:ci_test_only@127.0.0.1:5432/qunthink_paging_ledger
      QUNTHINK_TEST_RESTORE_PG_URL: postgresql://postgres:ci_test_only@127.0.0.1:5432/qunthink_restore
      QUNTHINK_TEST_RESTORE_LEDGER_URL: postgresql://postgres:ci_test_only@127.0.0.1:5432/qunthink_restore_ledger
      QUNTHINK_TEST_MONGO_URL: mongodb://127.0.0.1:27017/qunthink_order_ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: qunthink_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qunthink_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mongo:
        image: mongodb/mongodb-community-server:9.0.2-ubi8-slim@sha256:65ca4eddc5dbeae94350b4a3889f2c1194e2b940f968e0341cccc2a5c98c666c
        ports:
          - 127.0.0.1:27017:27017
        options: --platform linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: ./backend
      - name: Record exact backend storage source manifest
        run: node scripts/ci-storage-evidence.mjs
        working-directory: ./backend
      - name: Prepare disposable verified storage fixtures
        env:
          CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          CI_MONGO_CONTAINER: ${{ job.services.mongo.id }}
        shell: bash
        run: |
          mkdir -p "$QUNTHINK_STORAGE_EVIDENCE_DIR"
          set +e
          raw_log=$(mktemp "$RUNNER_TEMP/qunthink-storage-setup.XXXXXX")
          timeout 120s bash scripts/setup-ci-storage.sh > "$raw_log" 2>&1
          status=$?
          printf '%s\n' "$status" > "$QUNTHINK_STORAGE_EVIDENCE_DIR/setup.exit"
          receipt_status=$?
          node scripts/ci-storage-evidence.mjs sanitize-setup "$raw_log"
          evidence_status=$?
          set -e
          echo "Storage setup exit: $status; receipt exit: $receipt_status; evidence exit: $evidence_status"
          if [[ "$status" -ne 0 ]]; then exit "$status"; fi
          if [[ "$receipt_status" -ne 0 || "$evidence_status" -ne 0 ]]; then exit 1; fi
        working-directory: ./backend
      - name: Check backend syntax
        run: node --check src/index.js
        working-directory: ./backend
      - name: Backend tests with required real-storage preflight and zero-skip gate
        run: npm test
        working-directory: ./backend
      - name: Backend production dependency audit
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
        working-directory: ./backend
      - name: Validate OpenAPI spec
        run: node scripts/validate-openapi.mjs

      - name: Save bounded backend storage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qunthink-backend-storage-evidence
          path: ${{ runner.temp }}/qunthink-storage-evidence/
          if-no-files-found: error
          retention-days: 1

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Artifact packaging integrity tests (no browser or listener)
        run: node --test scripts/pack-ci-evidence.test.mjs
      - name: Preserve brand and entry animation
        run: node scripts/verify-brand.mjs
      - name: Frontend tests
        run: npm test
        working-directory: ./frontend
      - name: Frontend type check and production build (tsc + vite)
        run: npm run build
        working-directory: ./frontend
      - name: Frontend production dependency audit (zero findings)
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --registry=https://registry.npmjs.org --json > audit.json
          audit_status=$?
          set -e
          node scripts/check-frontend-audit.mjs audit.json
          if [[ "$audit_status" -gt 1 ]]; then
            echo "npm audit failed to produce a valid report (exit $audit_status)"
            exit "$audit_status"
          fi
        working-directory: ./frontend

  ui-browser-check:
    name: ui-browser-check (${{ matrix.project }}${{ matrix.suite == 'q2' && ', Q2' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-reduced-motion]
        suite: [core, q2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend && npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: ./frontend
      - name: Real browser desktop/mobile and failure-recovery flows
        if: matrix.suite == 'core'
        run: npm run test:e2e -- --project=${{ matrix.project }}
        working-directory: ./frontend
      - name: Site AI isolated desktop/mobile consent and failure flows
        if: ${{ !cancelled() && matrix.suite == 'core' }}
        run: npx playwright test --config=playwright.site-basic.config.ts --project=${{ matrix.project }}
        working-directory: ./frontend
      - name: Q1 same-draft result chain and bounded failure recovery
        if: ${{ !cancelled() && matrix.suite == 'core' }}
        run: npx playwright test --config=playwright.q1.config.ts --project=${{ matrix.project }}
        working-directory: ./frontend
      - name: Q2 original-command closure and same-document recovery
        if: ${{ !cancelled() && matrix.suite == 'q2' }}
        run: npx playwright test --config=playwright.q2.config.ts --project=${{ matrix.project }}
        working-directory: ./frontend
      - name: Memory same-ID recovery and two-tab late-response privacy
        if: ${{ !cancelled() && matrix.suite == 'q2' }}
        run: npx playwright test --config=playwright.memory-recovery.config.ts --project=${{ matrix.project }}
        working-directory: ./frontend
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qunthink-browser-evidence${{ matrix.suite == 'q2' && '-q2' || '' }}-${{ matrix.project }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 1
      - name: Losslessly package all browser evidence into bounded parts
        id: package-evidence
        if: always()
        env:
          EVIDENCE_PROJECT: ${{ matrix.suite }}-${{ matrix.project }}
        run: node scripts/pack-ci-evidence.mjs archive .ci-evidence frontend/playwright-report frontend/test-results
      - name: Save browser-evidence-parts manifest
        if: ${{ always() && steps.package-evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: qunthink-browser-evidence${{ matrix.suite == 'q2' && '-q2' || '' }}-parts-${{ matrix.project }}-manifest
          path: .ci-evidence/manifest.json
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: true
          retention-days: 1
      - name: Save browser-evidence-parts part 001
        if: ${{ always() && steps.package-evidence.outcome == 'success' && hashFiles('.ci-evidence/evidence.part-001') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: qunthink-browser-evidence${{ matrix.suite == 'q2' && '-q2' || '' }}-parts-${{ matrix.project }}-part-001
