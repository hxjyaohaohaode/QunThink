name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: qunthink_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qunthink_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: ./backend
      - name: Check backend syntax
        run: node --check src/index.js
        working-directory: ./backend
      - name: Backend tests
        env:
          QUNTHINK_TEST_PG_URL: postgresql://postgres:ci_test_only@127.0.0.1:5432/qunthink_ci
        run: npm test
        working-directory: ./backend
      - name: Backend production dependency audit
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
        working-directory: ./backend
      - name: Validate OpenAPI spec
        run: node scripts/validate-openapi.mjs

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Frontend tests
        run: npm test
        working-directory: ./frontend
      - name: Frontend type check and production build (tsc + vite)
        run: npm run build
        working-directory: ./frontend
      - name: Frontend dependency audit (documented SPA exception only)
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --registry=https://registry.npmjs.org --json > audit.json
          audit_status=$?
          set -e
          node scripts/check-frontend-audit.mjs audit.json
          if [[ "$audit_status" -gt 1 ]]; then
            echo "npm audit failed to produce a valid report (exit $audit_status)"
            exit "$audit_status"
          fi
        working-directory: ./frontend

  docker:
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-check]
    strategy:
      matrix:
        include:
          - name: qunxiang-backend
            context: ./backend
            file: ./backend/Dockerfile
          - name: qunxiang-frontend
            context: .
            file: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: ${{ matrix.name }}:ci
