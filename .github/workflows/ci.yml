  docker:
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-check, ui-browser-check]
    strategy:
      matrix:
        include:
          - name: qunxiang-backend
            context: ./backend
            file: ./backend/Dockerfile
          - name: qunxiang-frontend
            context: .
            file: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: ${{ matrix.name }}:ci
