      summary: 删除已停止的任务及其结果
      tags:
        - Tasks
      parameters: *a1
      responses:
        "204":
          description: 已删除
        "404":
          description: 任务不存在
        "409":
          description: 请先停止运行中的任务
  /api/tasks/{taskId}/run:
    parameters:
      - name: X-Expected-User-Id
        in: header
        required: false
        description: 写操作提交前捕获的账号标识；与认证账号不符时返回 409 ACCOUNT_CHANGED，不改变任何任务
        schema:
          type: string
    post:
      operationId: runWorkspaceTask
      description: 每次新生成意图使用新 UUID；同一任务复用请求号只返回任务当前状态，不再次调用模型。网络断开、5xx 或发送后停止可能返回 outcome_unknown，须先核验才能显式重试。此保证限于当前单进程用户存储，未证明多 Worker 并发。
      summary: 生成一次待验收的 AI 草稿并等待结果，可能计费
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                client_request_id:
                  type: string
                  format: uuid
              additionalProperties: false
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceTask"
        "400":
          description: 请求无效
        "401":
          description: 需要登录
        "404":
          description: 资源不属于当前用户或不存在
        "409":
          description: 配置版本冲突、任务运行中或模型被引用
        "429":
          description: 达到执行次数或请求限制
  /api/tasks/{taskId}/accept:
    parameters:
      - name: X-Expected-User-Id
        in: header
        required: false
        description: 写操作提交前捕获的账号标识；与认证账号不符时返回 409 ACCOUNT_CHANGED，不改变任何任务
        schema:
          type: string
    post:
      operationId: acceptWorkspaceTaskResult
      summary: 当前用户验收本次生成的草稿；来源变化时拒绝
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                run_id:
                  type: string
                  format: uuid
              required: [run_id]
              additionalProperties: false
      responses:
        "200":
          description: 验收记录已保存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceTask"
        "400":
          description: 运行标识无效
        "404":
          description: 任务不存在或不属于当前用户
        "409":
          description: 成果不是当前运行的草稿或来源已变化
  /api/tasks/{taskId}/resolve-unknown:
    parameters:
      - name: X-Expected-User-Id
        in: header
        required: false
        description: 写操作提交前捕获的账号标识；与认证账号不符时返回 409 ACCOUNT_CHANGED，不改变任何任务
        schema:
          type: string
    post:
      operationId: resolveUnknownWorkspaceTaskRun
      summary: 人工处理结果未知的运行；允许重试前须确认重复调用与费用风险
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  enum: [allow_retry, abandon]
                run_id:
                  type: string
                  format: uuid
                  description: 必须传入用户检查时的待核验运行标识，拒绝将旧决定应用到新的运行
              required: [decision, run_id]
              additionalProperties: false
      responses:
        "200":
          description: 用户决定及执行记录已保存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceTask"
        "400":
          description: 决定无效
        "404":
          description: 任务不存在或不属于当前用户
        "409":
          description: 当前任务没有待处理的未知结果

  /api/goals:
    get:
      tags: [Goals]
      operationId: listPersonalGoals
      summary: 读取当前登录者的个人目标
      description: 仅会话认证；需要已部署 PostgreSQL foundation v2，响应 executionAvailable 为 false。
      responses:
        '200': { description: 个人目标列表 }
        '401': { description: 需要有效会话 }
        '503': { description: PostgreSQL 运行连接未配置或迁移未完成 }
    post:
      tags: [Goals]
      operationId: createPersonalGoal
      summary: 创建持久目标及必需验收条件
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalGoalInput' }
      responses:
        '201': { description: 新目标；目标 ID 由服务端按会话和幂等键派生 }
        '200': { description: 同键同内容重放 }
        '400': { description: 输入无效或缺幂等键 }
        '401': { description: 需要有效会话 }
        '409': { description: 同键不同内容 }
        '503': { description: PostgreSQL foundation 不可用 }
  /api/goals/{goalId}:
    parameters: [ { $ref: '#/components/parameters/PersonalGoalId' } ]
    get:
      tags: [Goals]
      operationId: getPersonalGoal
      summary: 读取目标、验收条件和运行状态
      responses:
        '200': { description: 目标及运行状态 }
        '401': { description: 需要有效会话 }
        '404': { description: 目标不属于当前个人空间 }
        '503': { description: PostgreSQL foundation 不可用 }
  /api/goals/{goalId}/briefs:
    parameters: [ { $ref: '#/components/parameters/PersonalGoalId' } ]
    post:
      tags: [Goals]
      operationId: requestPersonalGoalBrief
      summary: 显式授权并执行零费用的受限个人目标简报
      description: 仅执行 internal.goal_brief.v1。简报是待用户核对的产物，不能作为目标完成验收证据；相同幂等键可查询并推进原运行。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '201': { description: 授权与运行已创建；artifactId 可能仍为空，须按运行状态恢复 }
        '200': { description: 同一请求重放及进度核对 }
        '400': { description: 缺少幂等键或请求无效 }
        '401': { description: 需要有效会话 }
        '404': { description: 目标不属于当前个人空间 }
        '409': { description: 幂等冲突或目标状态不允许 }
        '503': { description: PostgreSQL foundation 不可用 }
  /api/goals/{goalId}/runs:
    parameters: [ { $ref: '#/components/parameters/PersonalGoalId' } ]
    post:
      tags: [Goals]
      operationId: createPersonalGoalRun
      summary: 为目标建立待领取的持久运行及步骤
      description: 仅创建 queued 运行；当前没有自动 Worker 或工具执行。
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalRunInput' }
      responses:
        '201': { description: 新建运行 }
        '200': { description: 同键同内容重放 }
        '400': { description: 步骤输入无效 }
        '401': { description: 需要有效会话 }
        '404': { description: 目标不存在 }
        '409': { description: 幂等冲突或目标状态不允许 }
        '503': { description: PostgreSQL foundation 不可用 }
  /api/goals/{goalId}/runs/{runId}:
    parameters: &personalRunPath
      - { $ref: '#/components/parameters/PersonalGoalId' }
      - { $ref: '#/components/parameters/PersonalRunId' }
    get:
      tags: [Goals]
      operationId: getPersonalGoalRun
      summary: 读取运行、步骤、效果和验收状态
      responses:
        '200': { description: 当前持久状态 }
        '401': { description: 需要有效会话 }
        '404': { description: 运行或目标不属于当前用户 }
        '503': { description: PostgreSQL foundation 不可用 }
  /api/goals/{goalId}/runs/{runId}/brief:
    parameters: *personalRunPath
    get:
      tags: [Goals]
      operationId: readPersonalGoalBrief
      summary: 读取已完成的受限简报正文、来源和内容哈希
      description: 仅当前登录者的个人空间及目标、运行、产物均可读时返回；未完成或验签失败不返回正文。
      responses:
        '200': { description: 简报正文、哈希和来源修订 }
        '401': { description: 需要有效会话 }
        '404': { description: 简报尚未形成或不属于当前目标与运行 }
        '409': { description: 产物完整性或来源核对失败 }
        '503': { description: PostgreSQL foundation 不可用 }
  /api/goals/{goalId}/runs/{runId}/pause:
    parameters: *personalRunPath
    post:
      tags: [Goals]
      operationId: pausePersonalGoalRun
      summary: 暂停运行；已发外部效果须继续核验
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: &personalRunTransitionResponses
        '200': { description: 新运行状态或幂等回执 }
        '400': { description: 缺幂等键或输入无效 }
        '401': { description: 需要有效会话 }
        '404': { description: 运行不存在 }
        '409': { description: 状态或幂等冲突 }
        '503': { description: PostgreSQL foundation 不可用 }
  /api/goals/{goalId}/runs/{runId}/resume:
    parameters: *personalRunPath
    post:
      tags: [Goals]
      operationId: resumePersonalGoalRun
      summary: 重新核对目标修订和未知效果后恢复
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: *personalRunTransitionResponses
  /api/goals/{goalId}/runs/{runId}/cancel:
    parameters: *personalRunPath
    post:
      tags: [Goals]
      operationId: cancelPersonalGoalRun
      summary: 取消新动作；未知外部效果保留
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: *personalRunTransitionResponses
  /api/goals/{goalId}/runs/{runId}/accept:
    parameters: *personalRunPath
    post:
      tags: [Goals]
      operationId: acceptPersonalRunEvidence
      summary: 当前验收者将检查绑定到同运行的当前产物修订
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalAcceptanceInput' }
      responses: *personalRunTransitionResponses
  /api/goals/{goalId}/runs/{runId}/complete:
    parameters: *personalRunPath
    post:
      tags: [Goals]
      operationId: completePersonalGoalRun
      summary: 仅全部步骤、效果及当前产物验收通过时完成运行
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses: *personalRunTransitionResponses
  /api/goals/{goalId}/complete:
    parameters: [ { $ref: '#/components/parameters/PersonalGoalId' } ]
    post:
      tags: [Goals]
      operationId: completePersonalGoal
      summary: 以同修订已验收运行完成目标
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runId]
              additionalProperties: false
              properties:
                runId: { type: string }
      responses: *personalRunTransitionResponses

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session_token
      description: 登录端点下发的 httpOnly 会话 Cookie
    csrfHeader:
      type: apiKey
      in: header
      name: x-csrf-token
      description: |
        所有非安全方法（POST/PUT/PATCH/DELETE）必须携带，
        令牌通过 GET /api/csrf-token 获取，且须与 Cookie 中的
        CSRF 值一致（double-submit 模式）
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    PersonalGoalId:
      in: path
      name: goalId
      required: true
      schema: { type: string }
    PersonalRunId:
      in: path
      name: runId
      required: true
      schema: { type: string }
    GroupIdAsId:
      in: path
      name: id
      required: true
      schema: { type: string }
      description: 群组 ID（groups 路由使用 :id）
    GroupIdParam:
      in: path
      name: groupId
      required: true
      schema: { type: string }
      description: 群组 ID（messages 路由使用 :groupId）
    MessageIdParam:
      in: path
      name: id
      required: true
      schema: { type: string }
    TtsMessageIdParam:
      in: path
      name: messageId
      required: true
      schema: { type: string }
    FileIdParam:
      in: path
      name: id
      required: true
      schema: { type: string }
    AiIdParam:
      in: path
      name: aiId
      required: true
      schema: { type: string }
    AgentIdParam:
      in: path
      name: agentId
      required: true
      schema: { type: string }
    ModelIdParam:
      in: path
      name: modelId
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: 请求参数不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: 未认证或会话失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: 无权访问（CSRF 校验失败/权限不足）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServerError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ModelProbeReceipt:
      type: object
      additionalProperties: false
      required: [requestId, modelId, capability, status, healthy, stale, possibleCharge, replayed]
      properties:
        requestId: { type: string, format: uuid, description: 原请求的规范 UUID，别名也返回此值 }
        modelId: { type: string }
        capability: { type: string, enum: [chat, vision, tts] }
        status: { type: string, enum: [running, succeeded, failed, unknown] }
        healthy: { type: boolean, description: 仅当成功回执仍验证当前配置时为 true }
        stale: { type: boolean, description: 配置或验证结果已过时；历史成功不能替代当前能力测试 }
        possibleCharge: { type: boolean, description: 可能已发送/计费，不是供应商账单或准确费用回执 }
        replayed: { type: boolean }
        responseTime: { type: integer, minimum: 0 }
        code:
          type: string
          enum: [PROBE_UNKNOWN, PROBE_FAILED, PROBE_REJECTED, PROBE_NOT_SENT, PROBE_STALE, PROBE_CONFIG_CHANGED, PROBE_STORAGE_UNCERTAIN]
        error: { type: string, description: 固定脱敏提示，不含供应商原始错误或凭据 }
    PersonalGoalInput:
      type: object
      required: [outcome, checks]
      additionalProperties: false
      properties:
        outcome: { type: string, minLength: 1, maxLength: 10000 }
        constraints:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 2000 }
        checks:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [key, description, required]
            additionalProperties: false
            properties:
              key: { type: string, minLength: 1, maxLength: 128 }
              description: { type: string, minLength: 1, maxLength: 2000 }
              required: { type: boolean }
        budgetLimitMicros:
          type: string
          pattern: '^(0|[1-9][0-9]{0,19})$'
    PersonalRunInput:
      type: object
      required: [steps]
      additionalProperties: false
      properties:
        steps:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [key, action, inputRefs, maxAttempts]
            additionalProperties: false
            properties:
              key: { type: string, minLength: 1, maxLength: 128 }
              action: { type: string, minLength: 1, maxLength: 2000 }
              inputRefs:
                type: array
                maxItems: 100
                items: { type: string, minLength: 1, maxLength: 128 }
              maxAttempts: { type: integer, minimum: 1, maximum: 10 }
    PersonalAcceptanceInput:
      type: object
      required: [checkKey, artifactId, artifactRevision]
      additionalProperties: false
      properties:
        checkKey: { type: string, minLength: 1, maxLength: 128 }
        artifactId: { type: string, minLength: 1, maxLength: 128 }
        artifactRevision: { type: integer, minimum: 0 }
    ApiError:
      type: object
      required: [ error ]
      properties:
        error:
          type: string
    SuccessEnvelope:
      type: object
      required: [ success ]
      properties:
        success:
          type: boolean
          const: true
    HealthResponse:
      type: object
      required: [ status, timestamp ]
      properties:
        status:
          type: string
          enum: [ ok, degraded ]
        timestamp:
          type: string
          format: date-time
        database:
          type: string
          enum: [ connected, error ]
    CsrfTokenResponse:
      type: object
      required: [ enabled ]
      properties:
        enabled: { type: boolean }
        csrfToken:
          type: string
          nullable: true
    SessionStatusResponse:
      type: object
      required: [ enabled ]
      properties:
        enabled: { type: boolean }
        valid: { type: boolean }
        mode:
          type: string
          enum: [ session, token ]
        message: { type: string }
    AuthUser:
      type: object
      required: [ id, username ]
      properties:
        id: { type: string }
        username: { type: string }
        nickname: { type: string }
        phone: { type: string }
    AuthResponse:
      type: object
      required: [ success, user ]
      properties:
        success:
          type: boolean
          const: true
        user:
          $ref: '#/components/schemas/AuthUser'
    PhoneInput:
      type: object
      required: [ phone ]
      additionalProperties: false
      properties:
        phone:
          type: string
          pattern: '^1[3-9][0-9]{9}$'
    PhoneLoginInput:
      type: object
      required: [ phone, password ]
      additionalProperties: false
      properties:
        phone:
          type: string
          pattern: '^1[3-9][0-9]{9}$'
        password: { type: string }
    SmsVerifyInput:
      type: object
      required: [ phone, code ]
      additionalProperties: false
      properties:
        phone:
          type: string
          pattern: '^1[3-9][0-9]{9}$'
        code:
          type: string
          pattern: '^[0-9]{4,8}$'
    SmsRegisterInput:
      type: object
      required: [ phone, password, code ]
      additionalProperties: false
      properties:
        phone:
          type: string
          pattern: '^1[3-9][0-9]{9}$'
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: 必须包含大写字母、小写字母和数字
        code:
          type: string
          pattern: '^[0-9]{4,8}$'
        nickname:
          type: string
          maxLength: 50
    DevRegisterInput:
      type: object
      required: [ username, password ]
      properties:
        username:
          type: string
          pattern: '^[a-zA-Z0-9_-]{3,64}$'
        password:
          type: string
          minLength: 8
          maxLength: 128
        nickname: { type: string }
    BootstrapResponse:
      type: object
      required: [ success, user, groups ]
      properties:
        success:
          type: boolean
          const: true
        user:
          type: object
          required: [ id ]
          properties:
            id: { type: string }
            username: { type: string }
            nickname: { type: string }
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        profile:
          type: object
          additionalProperties: true
        personas:
          type: object
          additionalProperties: true
        apiConfigs:
          type: object
          additionalProperties: true
    GroupFile:
      type: object
      required: [ id, group_id, name, url, size, type, uploaded_at ]
      properties:
        id: { type: string }
        group_id: { type: string }
        name: { type: string }
        url: { type: string }
        size: { type: number }
        type: { type: string }
        uploaded_at:
          type: string
          format: date-time
    Group:
      type: object
      required:
        - id
        - name
        - description
        - type
        - debate_mode
        - debate_level
        - ai_members
        - created_at
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        type:
          type: string
          enum: [ preset, custom, private, ai_private ]
        is_private: { type: boolean }
        is_ai_private: { type: boolean }
        pinned: { type: boolean }
        avatar_url: { type: [ string, 'null' ] }
        avatar_color: { type: [ string, 'null' ] }
        background_url: { type: [ string, 'null' ] }
        announcement: { type: string }
        notifications_enabled: { type: boolean }
        debate_mode: { type: boolean }
        debate_level: { type: integer }
        debate_config:
          $ref: '#/components/schemas/DebateConfig'
        ai_members:
          type: array
          items: { type: string }
        created_at:
          type: string
          format: date-time
        last_message_at:
          type: string
          format: date-time
        last_message_preview: { type: [ string, 'null' ] }
        topic: { type: string }
        is_active: { type: boolean }
        files:
          type: array
          items:
            $ref: '#/components/schemas/GroupFile'
    DebateConfig:
      type: object
      additionalProperties: true
      properties:
        mode: { type: string }
        topic: { type: string }
        roles:
          type: object
          properties:
            proponents:
              type: array
              items: { type: string }
            opponents:
              type: array
              items: { type: string }
            judge:
              type: array
              items: { type: string }
            audience:
              type: array
              items: { type: string }
        memory_enabled: { type: boolean }
        time_limit: { type: number }
