          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelProbeReceipt' }
        '400': { description: 请求号无效 }
        '401': { description: 需要登录 }
        '404': { description: 本账号没有此请求号 }
        '503': { description: 记录不可可靠读取或写入；不能把查询失败当成可以重试 }
