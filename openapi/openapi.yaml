          description: 需要登录
        "404":
          description: 资源不属于当前用户或不存在
        "409":
          description: 配置版本冲突、任务运行中或模型被引用
        "429":
          description: 达到执行次数或请求限制
  /api/user/model-catalog/test:
    post:
      operationId: testCatalogModel
      summary: 发起有持久请求号的能力测试（可能计费），重复请求不重发
      description: >-
        必须在 Idempotency-Key 或 clientRequestId 提供 UUID；两者同时存在必须相同。
        测试只使用固定的合成输入。视觉测试最多发送两次请求，每次超时 20 秒，整体截止 60 秒。
        浏览器停止等待不会取消已授权测试。相同请求号重放记录；同模型、能力及配置的 running/unknown 请求即使换号也返回原请求，别名号持久关联。
        unknown 只允许查询核验，没有自动重试或清空入口；可能一直阻止同配置新测试。
      tags: [Models]
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          description: 每次新测试意图的 UUID；中断后保留并查询，不能为了重试换号
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelId]
              properties:
                clientRequestId: { type: string, format: uuid }
                modelId: { type: string, maxLength: 80 }
                capability: { type: string, enum: [chat, vision, tts], default: chat }
                expectedRevision: { type: integer, minimum: 0, description: 新准入必须匹配目录修订；同请求号重放必须保持原值 }
      responses:
        '200':
          description: 已完成或已完成记录的重放；只有 healthy=true 验证当前配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelProbeReceipt' }
        '202':
          description: 仍在运行或结果未知；保留 requestId，仅查询，不自动重发
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelProbeReceipt' }
        '400': { description: 请求号缺失、无效、头体不一致或参数无效 }
        '401': { description: 需要登录 }
        '404': { description: 模型不存在 }
        '409':
          description: 请求号用于不同模型/能力/版本条件、配置不可用或测试已过时；新准入版本不匹配返回 PROBE_CONFIG_CHANGED、possibleCharge=false 回执（未创建效果）
        '429':
          description: 每账号最多 10 次新测试/分钟、100 次/UTC日、2 次并发、2000 条效果或 10000 个请求号；旧记录不会自动淘汰
        '502':
          description: 已知测试失败，当前能力未验证；仍可能产生费用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelProbeReceipt' }
        '503': { description: 无法可靠读取或写入记录，禁止新付费调用；保留原请求号查询 }
  /api/user/model-catalog/tests/{requestId}:
    get:
      operationId: getCatalogModelProbe
      summary: 查询当前账号的能力测试效果（不会调用服务商）
      tags: [Models]
      parameters:
        - in: path
          name: requestId
