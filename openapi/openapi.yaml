  # --------------------------------------------------------------------- Tts
  /api/tts/voices:
    get:
      tags: [ Tts ]
      operationId: getTtsVoices
      summary: 获取可用音色与语气列表
      responses:
        '200':
          description: 音色/语气清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TtsVoicesResponse'
  /api/tts/synthesize:
    post:
      tags: [ Tts ]
      operationId: synthesizeSpeech
      summary: 文本转语音（持久幂等键、每日配额、未知效果查询）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TtsSynthesizeInput'
      responses:
        '200':
          description: 合成结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TtsSynthesizeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '202':
          description: 供应商结果运行中或未知，可能已计费；同键或同输入的未核验新键不会再次调用，返回原请求号
          content:
            application/json:
              schema:
                type: object
                required: [success, status, requestId, possibleCharge]
                properties:
                  success: { type: boolean, const: false }
                  status: { type: string, enum: [running, unknown] }
                  requestId: { type: string, format: uuid }
                  possibleCharge: { type: boolean }
                  error: { type: string }
        '409':
          description: 幂等键已用于不同输入
        '410':
          description: 原成果已删除，相同幂等键不会再执行
        '429':
          description: 今日合成次数已达上限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/tts/effects/{requestId}:
    get:
      tags: [ Tts ]
      operationId: getTtsEffect
      summary: 查询当前账号语音合成请求的持久状态
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 状态及已确认的成果
          content:
            application/json:
              schema:
                type: object
                required: [requestId, status, modelId, possibleCharge]
                properties:
                  requestId: { type: string, format: uuid }
                  status: { type: string, enum: [running, unknown, succeeded, deleted] }
                  modelId: { type: string }
                  possibleCharge: { type: boolean }
                  response:
                    oneOf:
                      - $ref: '#/components/schemas/TtsSynthesizeResponse'
                      - type: 'null'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tts/messages/{messageId}:
    get:
      tags: [ Tts ]
      operationId: getMessageTtsAudio
      summary: 获取消息已持久化的语音元数据
      parameters:
        - $ref: '#/components/parameters/TtsMessageIdParam'
      responses:
        '200':
