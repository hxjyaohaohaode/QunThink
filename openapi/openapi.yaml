# =============================================================================
# 群想（AI 群聊 · 大模型辩论场）OpenAPI 3.1 契约
#
# 本文档以 backend/src/routes/*.js 的真实路由为准生成/维护。
# 运行 `node scripts/validate-openapi.mjs` 可交叉校验文档与实现是否漂移。
#
# 认证模型：
#   - 会话 Cookie: session_token（httpOnly，登录端点下发）
#   - CSRF: 所有非安全方法需携带 x-csrf-token 头（先 GET /api/csrf-token 获取）
#   - 开发模式（AUTH_MODE=dev）下可用 x-user-id 头代替会话
# =============================================================================
openapi: 3.1.0
info:
  title: 群想 AI 群聊 API
  version: 1.0.0
  description: |
    以 backend/src 真实路由为准的接口契约。覆盖认证、短信、群组、消息、文件、
    TTS、社交互动、记忆、Agent、互动分析、监控、画像、人设与用户 API 配置等域。
    部分复杂查询端点（搜索、互动分析、监控指标等）的响应体为宽松对象，
    字段以实现为准，后续逐步收紧。
servers:
  - url: http://localhost:3002
    description: 本地后端
  - url: https://{YOUR_BACKEND_HOST}
    description: 生产后端（占位符，替换为真实 Render/自有域名）
    variables:
      YOUR_BACKEND_HOST:
        default: your-backend-host.example.com
tags:
  - name: System
    description: 健康检查 / CSRF / 启动聚合
  - name: Auth
    description: 会话认证（登录/注册/登出/会话查询）
  - name: Sms
    description: 短信验证码
  - name: Groups
    description: 群组 CRUD / 成员 / 置顶 / 设置 / 背景 / 辩论
  - name: PrivateChat
    description: 用户-AI 私聊与 AI-AI 私聊
  - name: Messages
    description: 消息 / 评论 / 点赞点踩 / 搜索 / 自主对话
  - name: Files
    description: 文件上传 / 下载 / 解析 / 检索索引
  - name: Tts
    description: 语音合成
  - name: Social
    description: 智能点赞 / 热门消息 / 评论分析
  - name: Memory
    description: 长期记忆
  - name: Agents
    description: 自定义智能体
  - name: Interaction
    description: 互动日志与分析
  - name: Monitoring
    description: 运行指标与客户端错误上报
  - name: Profile
    description: 用户画像
  - name: Personas
    description: AI 人设
  - name: ApiConfig
    description: 用户自定义 API 配置
  - name: Ai
    description: AI 模型运行时管理
  - name: Models
    description: 用户模型目录、服务商与协议配置
  - name: Tasks
    description: 持久化任务、主动执行和结果
  - name: Goals
    description: PostgreSQL 个人空间目标与持久运行契约；当前不提供 Worker 执行

security:
  - cookieAuth: []
  - csrfHeader: []

paths:
  # ------------------------------------------------------------------ System
  /api/health:
    get:
      tags: [ System ]
      operationId: getHealth
      summary: 健康检查（含存储层连通性，60s 缓存）
      security: []
      responses:
        '200':
          description: 服务健康
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: 服务降级
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/csrf-token:
    get:
      tags: [ System ]
      operationId: getCsrfToken
      summary: 获取 CSRF 令牌
      security: []
      responses:
        '200':
          description: CSRF 令牌（认证未启用时仅返回 enabled:false）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
  /api/bootstrap:
    get:
      tags: [ System ]
      operationId: getBootstrap
      summary: 首屏启动数据聚合（用户/群组/画像/人设/API配置）
      responses:
        '200':
          description: 启动数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  # -------------------------------------------------------------------- Auth
  /api/auth/token:
    get:
      tags: [ Auth ]
      operationId: getAuthTokenStatus
      summary: 查询会话状态
      security: []
      responses:
        '200':
          description: 会话状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusResponse'
  /api/auth/login-phone:
    post:
      tags: [ Auth ]
      operationId: loginWithPhone
      summary: 手机号 + 密码登录（生产认证链路）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneLoginInput'
      responses:
        '200':
          description: 登录成功，下发 session_token Cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 手机号或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/auth/register-sms:
    post:
      tags: [ Auth ]
      operationId: registerBySms
      summary: 短信验证码注册（生产注册链路）
      description: |
        需先调用 POST /api/sms/send 获取验证码。密码必须包含大小写字母与数字。
        注册成功自动建立会话并初始化用户数据库。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsRegisterInput'
      responses:
        '201':
          description: 注册成功，下发 session_token Cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 该手机号已注册
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 短信服务未配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/auth/register:
    post:
      tags: [ Auth ]
      operationId: devRegisterUser
      summary: '[dev-only] 用户名密码注册'
      x-dev-only: true
      deprecated: false
      description: |
        ⚠️ 仅在 NODE_ENV != production 时注册该路由，生产环境 404。
        仅供本地开发与自动化测试使用；生产注册必须走 /api/auth/register-sms。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevRegisterInput'
      responses:
        '201':
          description: 注册成功，下发 session_token Cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 用户名已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/auth/logout:
    post:
      tags: [ Auth ]
      operationId: logout
      summary: 登出并清除会话 Cookie
      responses:
        '200':
          description: 已登出
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/auth/me:
    get:
      tags: [ Auth ]
      operationId: getCurrentUser
      summary: 获取当前登录用户
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                type: object
                required: [ user ]
                properties:
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '401':
          description: 未登录（user:null + requiresAuth:true）
          content:
            application/json:
              schema:
                type: object
                required: [ user, requiresAuth ]
                properties:
                  user:
                    nullable: true
                  requiresAuth:
                    type: boolean

  # --------------------------------------------------------------------- Sms
  /api/sms/send:
    post:
      tags: [ Sms ]
      operationId: sendSmsCode
      summary: 发送短信验证码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneInput'
      responses:
        '200':
          description: 发送结果（阿里云返回体透传）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: 发送过于频繁
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 短信服务未配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/sms/verify:
    post:
      tags: [ Sms ]
      operationId: verifySmsCode
      summary: 校验短信验证码（不注册）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsVerifyInput'
      responses:
        '200':
          description: 校验结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: 验证码尝试次数过多
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 短信服务未配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  # ------------------------------------------------------------------ Groups
  /api/groups:
    get:
      tags: [ Groups ]
      operationId: listGroups
      summary: 获取群组列表
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: 群组数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [ Groups ]
      operationId: createGroup
      summary: 创建群组
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreateInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: 参数不合法（私聊需有效 ai_member；群聊至少 2 个 AI 成员）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/groups/{id}:
    get:
      tags: [ Groups ]
      operationId: getGroup
      summary: 获取群组详情
      parameters:
        - $ref: '#/components/parameters/GroupIdAsId'
      responses:
        '200':
          description: 群组详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [ Groups ]
      operationId: deleteGroup
      summary: 删除群组
      parameters:
        - $ref: '#/components/parameters/GroupIdAsId'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/groups/{id}/settings:
    put:
      tags: [ Groups ]
      operationId: updateGroupSettings
      summary: 更新群组设置（名称/头像/背景/公告/置顶/辩论配置等）
      parameters:
        - $ref: '#/components/parameters/GroupIdAsId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupSettingsInput'
      responses:
        '200':
          description: 更新成功（返回 {success, group}）
          content:
            application/json:
              schema:
                type: object
                required: [ success, group ]
                properties:
                  success: { type: boolean, const: true }
                  group:
                    $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/groups/{id}/debate:
    put:
      tags: [ Groups ]
      operationId: updateDebateMode
      summary: 开关辩论模式并设置辩论强度
      parameters:
        - $ref: '#/components/parameters/GroupIdAsId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebateUpdateInput'
      responses:
        '200':
          description: 更新后的群组
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/groups/{id}/pin:
    put:
      tags: [ Groups ]
      operationId: pinGroup
      summary: 置顶/取消置顶
      parameters:
        - $ref: '#/components/parameters/GroupIdAsId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinInput'
      responses:
        '200':
          description: 更新后的群组
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/groups/{id}/members:
    post:
      tags: [ Groups ]
      operationId: addGroupMember
      summary: 添加 AI 成员
      parameters:
        - $ref: '#/components/parameters/GroupIdAsId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberAddInput'
      responses:
        '200':
          description: 添加成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/groups/{id}/members/{aiId}:
    delete:
      tags: [ Groups ]
      operationId: removeGroupMember
      summary: 移除 AI 成员
      parameters:
        - $ref: '#/components/parameters/GroupIdAsId'
        - in: path
          name: aiId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 移除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/groups/{id}/upload-background:
    post:
      tags: [ Groups ]
      operationId: uploadGroupBackground
      summary: 上传群背景图（multipart，字段名 background）
      parameters:
        - $ref: '#/components/parameters/GroupIdAsId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ background ]
              properties:
                background:
                  type: string
                  format: binary
      responses:
        '200':
          description: 上传成功（返回 background_url 等）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/groups/{id}/background:
    get:
      tags: [ Groups ]
      operationId: getGroupBackground
      summary: 获取群背景图
      parameters:
        - $ref: '#/components/parameters/GroupIdAsId'
      responses:
        '200':
          description: 图片流
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
  /api/groups/{id}/files:
    get:
      tags: [ Groups ]
      operationId: listGroupFiles
      summary: 获取群文件列表
      parameters:
        - $ref: '#/components/parameters/GroupIdAsId'
      responses:
        '200':
          description: 群文件数组（{success, files}）
          content:
            application/json:
              schema:
                type: object
                required: [ success, files ]
                properties:
                  success: { type: boolean, const: true }
                  files:
                    type: array
                    items:
                      $ref: '#/components/schemas/GroupFile'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [ Groups ]
      operationId: legacyCreateGroupFile
      summary: '[已废弃守卫] 群文件上传入口（固定返回 400 引导）'
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/GroupIdAsId'
      responses:
        '400':
          description: 请使用 /api/files/upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/groups/{id}/files/{fileId}:
    delete:
      tags: [ Groups ]
      operationId: deleteGroupFile
      summary: 从群组移除文件记录
      parameters:
        - $ref: '#/components/parameters/GroupIdAsId'
        - in: path
          name: fileId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 移除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/groups/{id}/insights:
    get:
      tags: [ Groups ]
      operationId: getGroupInsights
      summary: 群聊洞察中心（发言分布/活跃度/社交互动/情感趋势）
      parameters:
        - $ref: '#/components/parameters/GroupIdAsId'
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 30, default: 7 }
      responses:
        '200':
          description: 聚合洞察数据
          content:
            application/json:
              schema:
                type: object
                required: [ success, group_id, window_days, totals, per_ai, activity_daily, sentiment_trend, participation_ratio ]
                properties:
                  success: { type: boolean }
                  group_id: { type: string }
                  window_days: { type: integer }
                  generated_at: { type: string, format: date-time }
                  totals:
                    type: object
                    properties:
                      messages: { type: integer }
                      ai_messages: { type: integer }
                      user_messages: { type: integer }
                      system_messages: { type: integer }
                      likes: { type: integer }
                      dislikes: { type: integer }
                      comments: { type: integer }
                      active_ais: { type: integer }
                  per_ai:
                    type: array
                    items:
                      type: object
                      properties:
                        ai_id: { type: string }
                        name: { type: string }
                        count: { type: integer }
                        last_active: { type: [ string, 'null' ], format: date-time }
                  activity_daily:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        count: { type: integer }
                  sentiment_trend:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        avg_score: { type: number }
                        samples: { type: integer }
                  participation_ratio: { type: number }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/groups/{groupId}/messages/read-batch:
    post:
      tags: [ Messages ]
      operationId: markMessagesReadBatch
      summary: 批量标记消息已读
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ messageIds ]
              properties:
                messageIds:
                  type: array
                  maxItems: 200
                  items: { type: string }
      responses:
        '200':
          description: 标记结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  requested: { type: integer }
                  updated: { type: integer }
        '400':
          $ref: '#/components/responses/BadRequest'

  # ------------------------------------------------------- Formal Debate
  /api/groups/{id}/formal-debate/start:
    post:
      tags: [ Groups ]
      operationId: startFormalDebate
      summary: 启动正式辩论
      parameters:
        - $ref: '#/components/parameters/GroupIdAsId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                可选字段（宽松对象）：topic、rolePreferences、debateLevel、
                selectedParticipants 等，以实现为准。
      responses:
        '200':
          description: 辩论已启动
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/groups/{id}/formal-debate/stop:
    post:
      tags: [ Groups ]
      operationId: stopFormalDebate
      summary: 停止正式辩论
      parameters:
        - $ref: '#/components/parameters/GroupIdAsId'
      responses:
        '200':
          description: 辩论已停止
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: '#/components/responses/NotFound'
  /api/groups/{id}/formal-debate/status:
    get:
      tags: [ Groups ]
      operationId: getFormalDebateStatus
      summary: 查询正式辩论状态
      parameters:
        - $ref: '#/components/parameters/GroupIdAsId'
      responses:
        '200':
          description: 辩论状态
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/groups/{id}/formal-debate/allocate-roles:
    post:
      tags: [ Groups ]
      operationId: allocateFormalDebateRoles
      summary: 分配辩论角色
      parameters:
        - $ref: '#/components/parameters/GroupIdAsId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: 可选 rolePreferences / selectedParticipants
      responses:
        '200':
          description: 角色分配结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: '#/components/responses/NotFound'
  /api/groups/{id}/formal-debate/audience-comment:
